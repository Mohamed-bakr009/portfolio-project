<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700">
<rect width="1200" height="700" fill="#0b1220"/><rect x="35" y="35" width="1130" height="630" rx="18" fill="#101a2b" stroke="#243450"/>
<text x="75" y="90" font-family="Arial" font-size="25" font-weight="700" fill="#fff">REST API</text><text x="75" y="118" font-family="Arial" font-size="13" fill="#8292ad">Node.js · Express · MongoDB</text>
<rect x="75" y="160" width="1050" height="58" rx="8" fill="#0b1220"/><text x="100" y="197" font-family="monospace" font-size="18" fill="#62d99a">GET</text><text x="175" y="197" font-family="monospace" font-size="18" fill="#dce7f7">/api/products</text><rect x="1000" y="180" width="95" height="24" rx="5" fill="#153c2c"/><text x="1020" y="198" font-family="Arial" font-size="11" fill="#65e5a0">200 OK</text>
<rect x="75" y="235" width="1050" height="58" rx="8" fill="#0b1220"/><text x="100" y="272" font-family="monospace" font-size="18" fill="#5da8ff">POST</text><text x="190" y="272" font-family="monospace" font-size="18" fill="#dce7f7">/api/orders</text><rect x="1000" y="255" width="95" height="24" rx="5" fill="#153c2c"/><text x="1020" y="273" font-family="Arial" font-size="11" fill="#65e5a0">201 OK</text>
<rect x="75" y="310" width="1050" height="58" rx="8" fill="#0b1220"/><text x="100" y="347" font-family="monospace" font-size="18" fill="#f4c45e">PATCH</text><text x="205" y="347" font-family="monospace" font-size="18" fill="#dce7f7">/api/orders/:id</text>
<rect x="75" y="385" width="1050" height="58" rx="8" fill="#0b1220"/><text x="100" y="422" font-family="monospace" font-size="18" fill="#ff6d7d">DELETE</text><text x="215" y="422" font-family="monospace" font-size="18" fill="#dce7f7">/api/users/:id</text>
<text x="75" y="505" font-family="monospace" font-size="14" fill="#667894">// Authentication</text><text x="75" y="535" font-family="monospace" font-size="14" fill="#667894">// Validation</text><text x="75" y="565" font-family="monospace" font-size="14" fill="#667894">// CRUD operations</text><text x="75" y="595" font-family="monospace" font-size="14" fill="#667894">// MongoDB integration</text></svg>